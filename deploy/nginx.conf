worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
  gzip_static on;
  # Caddy adds Via; without this, NGINX skips compression for proxy requests.
  gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/x-component application/xml text/xml text/plain;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        charset utf-8;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # The admin service is private; browser traffic stays on the HTTPS origin.
        location = /admin { proxy_pass http://admin:3031; }
        location ^~ /admin/ { proxy_pass http://admin:3031; }
        location ^~ /api/admin/ {
            client_max_body_size 8k;
            proxy_pass http://admin:3031;
        }
        location ^~ /api/admin/resumes {
            client_max_body_size 16m;
            proxy_read_timeout 90s;
            proxy_pass http://admin:3031;
        }
        location = /api/public/resume { proxy_pass http://admin:3031; }
        location = /resume.pdf { access_log off; proxy_pass http://admin:3031; }
        location ^~ /resumes/ { access_log off; proxy_pass http://admin:3031; }
        location ^~ /r/ {
            # Do not retain potentially identifying visitor URLs/IPs in access logs.
            access_log off;
            proxy_pass http://admin:3031;
        }

        # Hashed Vite assets can be cached across deployments.
        location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      # Location add_header directives replace inherited ones.
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
            try_files $uri =404;
        }

        location ~ \.rsc$ {
            default_type text/x-component;
            expires -1;
            try_files $uri =404;
        }

        location ~ /\. {
            deny all;
        }

        location / {
            expires -1;
            try_files $uri $uri.html $uri/ =404;
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
            expires -1;
        }
    }
}
