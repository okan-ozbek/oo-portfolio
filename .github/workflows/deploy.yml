name: Deploy to Production
on:
  push:
    branches:
      - master
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    concurrency:
      group: pixelware-verify-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies (timed)
        run: time npm ci
      - name: Install PDF library tools
        run: |
          if ! command -v pdfinfo >/dev/null || ! command -v pdftoppm >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends poppler-utils
          fi
      - run: time npm run lint
      - run: time npm run typecheck
      - run: time npm test
      - name: Validate VPS deployment files
        run: |
          bash -n deploy/install-release.sh
          bash -n scripts/publish-images.sh
          docker compose -f compose.vps.yaml config --quiet
      - name: Set up cached Docker builds
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build admin image once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.admin
          load: true
          tags: pixelware-ci-admin:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=pixelware-admin
          cache-to: type=gha,scope=pixelware-admin,mode=max,timeout=2m,ignore-error=true
      - name: Build compiler image once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.compiler
          load: true
          tags: pixelware-ci-compiler:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=pixelware-compiler
          cache-to: type=gha,scope=pixelware-compiler,mode=max,timeout=2m,ignore-error=true
      - name: Package verified frontend without rebuilding Node dependencies
        run: docker build -f deploy/Dockerfile.prebuilt --label org.opencontainers.image.source=https://github.com/${{ github.repository }} -t pixelware-ci-portfolio:${{ github.sha }} .
      - name: Verify deployment persistence, compiler isolation, and NGINX uploads in parallel
        env:
          PIXELWARE_TEST_ADMIN_IMAGE: pixelware-ci-admin:${{ github.sha }}
          PIXELWARE_TEST_COMPILER_IMAGE: pixelware-ci-compiler:${{ github.sha }}
          PIXELWARE_TEST_PORTFOLIO_IMAGE: pixelware-ci-portfolio:${{ github.sha }}
        shell: bash
        run: |
          pids=()
          npm run test:deploy &
          pids+=("$!")
          npm run test:resumes:compiler &
          pids+=("$!")
          npm run test:admin:container &
          pids+=("$!")
          status=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then status=1; fi
          done
          exit "$status"
      - name: Publish tested images and record immutable digests
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: time bash scripts/publish-images.sh
      - name: Save tested image manifest for deployment
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: portfolio-images-${{ github.sha }}
          path: compose.images.yaml
          if-no-files-found: error
          retention-days: 1
  deploy:
    if: github.ref == 'refs/heads/master'
    needs: verify
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: pixelware-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Restore tested image manifest from this workflow run
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: portfolio-images-${{ github.sha }}
          path: .
      - name: Transfer source and runtime secret over verified SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          VPS_COMPOSE_PROJECT: ${{ vars.VPS_COMPOSE_PROJECT }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$VPS_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]]
          if [[ ! "$VPS_COMPOSE_PROJECT" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
            echo '::error::Set VPS_COMPOSE_PROJECT to the existing VPS Compose project name, or pixelware for a fresh installation.'
            exit 1
          fi
          [[ "$ADMIN_PASSWORD_HASH" =~ ^scrypt-v1:[a-f0-9]{32}:[a-f0-9]{128}$ ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          key="$RUNNER_TEMP/deploy-key"
          hosts="$RUNNER_TEMP/deploy-known-hosts"
          hash="$RUNNER_TEMP/admin-password-hash"
          registry_auth="$RUNNER_TEMP/registry-auth"
          source_tar="$RUNNER_TEMP/pixelware-source.tar"
          archive="$RUNNER_TEMP/pixelware-source.tgz"
          trap 'rm -f "$key" "$hosts" "$hash" "$registry_auth" "$source_tar" "$archive"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$hosts"
          printf '%s\n' "$ADMIN_PASSWORD_HASH" > "$hash"
          printf '%s\n%s\n' "$GITHUB_ACTOR" "$REGISTRY_TOKEN" > "$registry_auth"
          test -s compose.images.yaml
          git archive --format=tar --output="$source_tar" HEAD
          tar --append --file="$source_tar" compose.images.yaml
          gzip -c "$source_tar" > "$archive"
          ssh_options=(-i "$key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$hosts" -o ServerAliveInterval=30 -o ServerAliveCountMax=60)
          ssh "${ssh_options[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'umask 077; mkdir -p "$HOME/pixelware-incoming"'
          scp "${ssh_options[@]}" -P "$VPS_PORT" "$archive" "$VPS_USER@$VPS_HOST:pixelware-incoming/source.tgz"
          scp "${ssh_options[@]}" -P "$VPS_PORT" "$hash" "$VPS_USER@$VPS_HOST:pixelware-incoming/admin_password_hash"
          scp "${ssh_options[@]}" -P "$VPS_PORT" "$registry_auth" "$VPS_USER@$VPS_HOST:pixelware-incoming/registry-auth"
          # The project argument is restricted to the safe characters checked above.
          ssh "${ssh_options[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "sudo -n bash -se -- $VPS_COMPOSE_PROJECT" < deploy/install-release.sh
