<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><meta name="color-scheme" content="dark">
  <title>Book reader · Pixelware</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/admin/pdfjs/web/pdf_viewer.css">
  <link rel="stylesheet" href="/admin/assets/blogs.css">
  <link rel="stylesheet" href="/blog/assets/blog.css">
  <link rel="stylesheet" href="/admin/assets/book-reader.css">
  <link rel="stylesheet" href="/admin/assets/pdf-notes.css">
  <script type="module" src="/blog/assets/book-reader.js"></script>
</head>
<body>
  <header class="reader-toolbar">
    <div class="reader-heading"><a href="/admin?section=books" aria-label="Back to library">← Library</a><h1 id="book-title">Book reader</h1></div>
    <div class="reader-controls" aria-label="Reading controls">
      <div class="control-group"><label for="page-number">Page</label><input id="page-number" data-document-control disabled type="number" min="1" value="1" inputmode="numeric"><span id="page-count">/ —</span></div>
      <div class="control-group reader-zoom"><label class="sr-only" for="zoom">Zoom</label><select id="zoom" data-document-control disabled><option value="page-width">Fit width</option><option value="page-fit">Fit page</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option><option value="custom" hidden>Custom</option></select></div>
      <button id="theme-toggle" aria-pressed="true" title="Display pages in dark mode. Turn off for original image colors.">Dark mode</button>
      <button id="colors-toggle" aria-expanded="false" aria-controls="colors-panel">Reading colors</button>
      <button id="find-toggle" data-document-control disabled aria-expanded="false" aria-controls="find-bar">Find</button>
      <button id="note-add" data-document-control disabled aria-pressed="false">＋ Note</button>
      <button id="notes-toggle" data-document-control disabled aria-pressed="true">Show notes</button>
      <a id="original-pdf" hidden target="_blank" rel="noopener">Original PDF ↗</a>
    </div>
    <section id="colors-panel" class="reader-colors-panel" aria-labelledby="colors-title" hidden>
      <div class="reader-colors-heading"><h2 id="colors-title">Reading colors</h2><button type="button" id="colors-close" aria-label="Close reading colors">×</button></div>
      <label class="reader-colors-switch"><input id="colors-enabled" type="checkbox">Use reading colors</label>
      <div id="color-presets" class="reader-color-presets" role="group" aria-label="Suggested reading presets"></div>
      <div class="reader-color-fields"><label class="reader-color-control"><span>Page background</span><input type="color" id="page-color" value="#24252a"></label><div id="text-color-controls"></div></div>
      <p id="colors-page-info" role="status"></p>
      <p class="reader-colors-note">Saved for this browser. Artwork using the same colors may also change.</p>
    </section>
    <form id="find-bar" hidden role="search"><label class="sr-only" for="find-input">Find in book</label><input id="find-input" type="search" placeholder="Find in book" autocomplete="off"><button type="button" id="find-previous" aria-label="Previous match">↑</button><button type="submit" aria-label="Next match">↓</button><span id="find-status" role="status"></span></form>
    <p id="reader-status" role="status">Loading book…</p>
  </header>
  <main class="reader-main"><div id="viewer-container" tabindex="0" aria-label="PDF pages"><div id="viewer" class="pdfViewer"></div></div></main>
  <div id="note-placement" class="note-placement" role="status" hidden><span>Click or tap anywhere on a PDF page to place your note. Press Enter to use the current page’s center.</span><button id="note-placement-cancel" type="button">Cancel</button></div>
  <dialog id="pdf-note-dialog" aria-labelledby="pdf-note-title">
    <form id="pdf-note-form">
      <div class="pdf-note-dialog-heading"><h2 id="pdf-note-title">PDF note</h2><button id="pdf-note-close" type="button" aria-label="Close PDF note">×</button></div>
      <p id="pdf-note-page"></p>
      <div class="pdf-note-workspace">
        <section class="pdf-note-editor"><label for="pdf-note-markdown">Note · Live Markdown</label><div class="pdf-note-editor-modes" role="group" aria-label="PDF note editor view"><button type="button" id="pdf-note-live" aria-pressed="true">Live</button><button type="button" id="pdf-note-source" aria-pressed="false">Markdown</button></div><textarea id="pdf-note-markdown" maxlength="100000" rows="8" placeholder="Write a thought, **highlight an idea**, or add a list…"></textarea></section>
        <section class="pdf-note-preview-pane" aria-label="Note size preview"><p class="pdf-note-preview-heading">Actual note size</p><div class="pdf-note-preview-viewport"><div id="pdf-note-preview" class="pdf-note-card"><div class="pdf-post-it-heading" aria-hidden="true"><span>✎ Edit note</span><span>⠿ Drag</span></div><div id="pdf-note-preview-content" class="pdf-note-content"></div></div></div></section>
      </div>
      <p id="pdf-note-error" role="alert"></p>
      <div class="pdf-note-dialog-actions"><button id="pdf-note-delete" type="button" hidden>Delete note</button><button id="pdf-note-cancel" type="button">Cancel</button><button id="pdf-note-save" type="submit">Save note</button></div>
    </form>
  </dialog>
  <noscript>Enable JavaScript to read books in dark mode.</noscript>
</body>
</html>
